# Modified config for processing both Russian and Ukrainian losses from Oryx, based on longrow input, but using SCD type two storage for summary and loss item tables

pipeline: "Oryx losses full - default"
tasks:
  - class: OryxLossesSummarySCD2
    table: summary
    steps: etl
    metadata:
      generated:
      - column: as_of
        method: date_from_filename
      - column: conflict
        method: resolve_from_filename
        args:
          attack-on-europe: "Russo-Ukrainian_War"
      - column: party
        method: resolve_from_filename
        args:
          attack-on-europe-documenting-equipment: "Russia"
          attack-on-europe-documenting-ukrainian: "Ukraine"

  - class: OryxLossesProofs
    table: proofs
    steps: etl
    metadata:
      generated:
      - column: conflict
        method: resolve_from_filename
        args:
          attack-on-europe: "Russo-Ukrainian_War"

  - class: OryxLossesItemSCD2
    table: loss_item
    steps: etl
    metadata:
      generated:
      - column: as_of
        method: date_from_filename
      - column: conflict
        method: resolve_from_filename
        args:
          attack-on-europe: "Russo-Ukrainian_War"
      - column: party
        method: resolve_from_filename
        args:
          attack-on-europe-documenting-equipment: "Russia"
          attack-on-europe-documenting-ukrainian: "Ukraine"
